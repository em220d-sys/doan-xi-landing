<style>
:root{

  --gold:#c9a96e;
  --ink:#171720;
  --bar-bg:#14141a;
  --bar-text:#f5f4f0;
  --bar-text-dim:rgba(245,244,240,.62);
  --bar-accent:#e3c88f;

  /* 라이트 테마 (기본) */
  --bg:#f5f4f0;
  --surface:#ffffff;
  --surface-2:#faf5ea;
  --text:#1a1a2e;
  --text-muted:#5a6478;
  --text-faint:#8a93a6;
  --accent:#a9814c;
  --accent-tint:rgba(169,129,76,.12);
  --border:rgba(169,129,76,.28);
  --notice-bg:#fdf6e3;
  --notice-text:#8a6d2f;
  --notice-border:rgba(169,129,76,.32);
  --shadow:0 1px 2px rgba(26,26,46,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111116;--surface:#1b1b22;--surface-2:#241f16;
    --text:#f2f0ea;--text-muted:#b6b6c2;--text-faint:#82828f;
    --accent:#e3c88f;--accent-tint:rgba(227,200,143,.16);--border:rgba(227,200,143,.28);
    --notice-bg:#2a2418;--notice-text:#e3c88f;--notice-border:rgba(227,200,143,.32);
    --shadow:0 1px 2px rgba(0,0,0,.5);

}
:root[data-theme="dark"]{

  --text:#f2f0ea;--text-muted:#b6b6c2;--text-faint:#82828f;
  --accent:#e3c88f;--accent-tint:rgba(227,200,143,.16);--border:rgba(227,200,143,.28);

}

*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--text);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  line-height:1.6;padding-bottom:112px;font-variant-numeric:tabular-nums;
}
button{font-family:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}

.wrap{max-width:640px;margin:0 auto;padding:32px 16px 60px}

.page-head{margin-bottom:20px}
.page-head h1{font-size:20px;font-weight:800;margin-bottom:8px;text-wrap:balance}
.notice{background:var(--notice-bg);border:1px solid var(--notice-border);color:var(--notice-text);font-size:12.5px;padding:10px 14px;border-radius:8px;line-height:1.5}

/* STEP ACCORDION */
.step{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);transition:opacity .2s}
.step.disabled{opacity:.45;pointer-events:none}

.step-head{width:100%;display:flex;align-items:center;gap:10px;padding:18px 18px;background:none;border:none;cursor:pointer;text-align:left}
.step-num{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent);background:var(--accent-tint);padding:4px 8px;border-radius:4px;white-space:nowrap}
.step-title{font-size:15px;font-weight:700;white-space:nowrap}
.step-value{margin-left:auto;font-size:13px;color:var(--text-muted);font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:4px}
.chevron{font-size:12px;color:var(--text-faint);transition:transform .3s;flex-shrink:0}
.step.open .chevron{transform:rotate(180deg)}

.step-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.step.open .step-body{max-height:360px;overflow-y:auto}

/* 단지/타입 등 버튼형 선택 그리드 */
.option-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;padding:4px 18px 18px}
.pick-btn{border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:12px 6px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;transition:.15s}
.pick-btn:hover{border-color:var(--gold)}
.pick-btn.active{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* unit list rows (호수, 옵션 공용) */
.unit-list{padding:4px 10px 14px;display:flex;flex-direction:column;gap:6px}
.unit-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:.15s}
.unit-row:hover{border-color:var(--gold)}
.unit-row.active{background:var(--accent-tint);border-color:var(--gold)}
.unit-row .u-main{font-size:14px;font-weight:700}
.unit-row .u-type{font-size:11.5px;color:var(--accent);font-weight:700;background:var(--accent-tint);padding:2px 7px;border-radius:20px;margin-left:2px}
.unit-row .u-price{margin-left:auto;font-size:13px;font-weight:700;color:var(--text-muted)}
.unit-row .u-check{width:18px;height:18px;border:1.5px solid var(--border);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink);background:var(--surface)}
.unit-row.active .u-check{background:var(--gold);border-color:var(--gold)}
.unit-row .u-body{flex:1;min-width:0}
.unit-row .u-top{display:flex;align-items:center;gap:10px}
.unit-row .u-top .u-main{flex:1}
.unit-row .u-top .u-price{flex-shrink:0;margin-left:0}
.unit-row.has-desc{align-items:flex-start}
.unit-row .u-desc{margin-top:4px;font-size:11.5px;color:var(--text-faint);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.unit-row.locked{cursor:default}
.unit-row.locked:hover{border-color:var(--gold)}
.gift-badge{font-size:11px;font-weight:700;color:var(--ink);background:var(--gold);padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.u-price.value-tag{color:var(--text-faint);font-weight:600;text-decoration:line-through}
.free-note{padding:2px 18px 14px;font-size:12px;color:var(--text-faint)}

/* price card */
.price-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;display:none}
.price-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13.5px;color:var(--text-muted)}
.price-row strong{color:var(--text);font-size:15px}
.price-row + .price-row{border-top:1px dashed var(--border)}

/* option category tabs */
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 8px;-webkit-overflow-scrolling:touch}
.cat-tab{flex-shrink:0;border:1px solid var(--border);background:var(--bg);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;white-space:nowrap}
.cat-tab.active{background:var(--text);border-color:var(--text);color:var(--bg)}

.selected-options{padding:10px 18px 16px;border-top:1px solid var(--border)}
.selected-options .so-title{font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:8px}
.chip-list{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:6px 8px 6px 12px;font-size:12.5px;color:var(--text)}
.chip .chip-price{color:var(--accent);font-weight:700}
.chip .chip-x{width:16px;height:16px;border-radius:50%;background:var(--text-faint);color:var(--surface);font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.chip-empty{font-size:12.5px;color:var(--text-faint)}

/* summary bar — 테마와 무관하게 고정된 다크 바(브랜드 요소) */
.summary-bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar-bg);color:var(--bar-text);padding:14px 16px;z-index:300;display:none;box-shadow:0 -6px 24px rgba(0,0,0,.3)}
.summary-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.summary-text{flex:1;min-width:220px}
.summary-line{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--bar-text-dim);flex-wrap:wrap;margin-bottom:4px}
.summary-line b{color:var(--bar-text);font-weight:700}
.summary-line .op{color:var(--bar-accent)}
.summary-total{font-size:19px;font-weight:800;color:var(--bar-accent);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.summary-total .raw{font-size:12px;font-weight:500;color:var(--bar-text-dim)}
.btn-generate{flex-shrink:0;background:var(--bar-accent);color:var(--ink);border:none;padding:13px 20px;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:.02em;white-space:nowrap}
.btn-generate:hover{filter:brightness(1.08)}

<div class="wrap">
  <div class="page-head">
    <h1>타입·층수 분양가 · 옵션 계산기 (초안)</h1>
    <div class="notice">
      ※ 아래 단지·타입·층수구간·분양가·옵션 데이터는 <b>구조 확인용 샘플</b>입니다. 실제 자료(엑셀)를 주시면 그대로 교체해서 반영합니다.
    </div>
  </div>

  <!-- STEP 1 : 단지 -->
  <section class="step" id="step1">
    <button class="step-head" type="button" data-toggle="step1">
      <span class="step-num">STEP 1</span>
      <span class="step-title">단지 선택</span>
      <span class="step-value" id="danjiValue">선택해주세요</span>
      <span class="chevron">▾</span>
    </button>
    <div class="step-body">
      <div class="option-grid" id="danjiList"></div>
    </div>
  </section>

  <!-- STEP 2 : 타입 -->
  <section class="step disabled" id="stepType">
    <button class="step-head" type="button" data-toggle="stepType">
      <span class="step-num">STEP 2</span>
      <span class="step-title">타입 선택</span>
      <span class="step-value" id="typeValue">단지를 먼저 선택해주세요</span>
      <span class="chevron">▾</span>
    </button>
    <div class="step-body">
      <div class="option-grid" id="typeList"></div>
    </div>
  </section>

  <!-- STEP 3 : 층수구간 -->
  <section class="step disabled" id="stepFloor">
    <button class="step-head" type="button" data-toggle="stepFloor">
      <span class="step-num">STEP 3</span>
      <span class="step-title">층수 선택</span>
      <span class="step-value" id="floorValue">타입을 먼저 선택해주세요</span>
      <span class="chevron">▾</span>
    </button>
    <div class="step-body">
      <div class="unit-list" id="floorList"></div>
    </div>
  </section>

  <!-- 분양가 카드 -->
  <div class="price-card" id="priceCard">
    <div class="price-row"><span>선택 정보</span><strong id="unitLabel">-</strong></div>
    <div class="price-row"><span>분양가</span><strong id="basePriceText">0원</strong></div>
  </div>

  <!-- STEP 4 : 확장비용 -->
  <section class="step disabled" id="stepExpand">
    <button class="step-head" type="button" data-toggle="stepExpand">
      <span class="step-num">STEP 4</span>
      <span class="step-title">확장비용 선택</span>
      <span class="step-value" id="expandValue">층수를 먼저 선택해주세요</span>
      <span class="chevron">▾</span>
    </button>
    <div class="step-body">
      <div class="unit-list" id="expandList"></div>
      <div class="free-note">※ 확장비용을 선택하셔야 아래 무상 제공 옵션이 적용됩니다.</div>
    </div>
  </section>

  <!-- STEP 5 : 무상 제공 옵션 -->
  <section class="step disabled" id="stepFree">
    <button class="step-head" type="button" data-toggle="stepFree">
      <span class="step-num">STEP 5</span>
      <span class="step-title">무상 제공 옵션</span>
      <span class="step-value" id="freeValue">확장비용을 먼저 선택해주세요</span>
      <span class="chevron">▾</span>
    </button>
    <div class="step-body">
      <div class="unit-list" id="freeList"></div>
      <div class="free-note">※ 무상 제공 항목은 기본 포함되어 있으며, 총 합계 금액에는 별도로 더해지지 않습니다.</div>
    </div>
  </section>

  <!-- STEP 6 : 유상 옵션 -->
  <section class="step disabled" id="stepOpt">
    <button class="step-head" type="button" data-toggle="stepOpt">
      <span class="step-num">STEP 6</span>
      <span class="step-title">옵션 선택</span>
      <span class="step-value" id="optValue">0개 선택</span>
      <span class="chevron">▾</span>
    </button>
    <div class="step-body">
      <div class="cat-tabs" id="catTabs"></div>
      <div class="unit-list" id="optList"></div>
      <div class="selected-options">
        <div class="so-title">선택한 옵션</div>
        <div class="chip-list" id="chipList"><span class="chip-empty">선택된 옵션이 없습니다</span></div>
      </div>
    </div>
  </section>
</div>

<div class="summary-bar" id="summaryBar">
  <div class="summary-inner">
    <div class="summary-text">
      <div class="summary-line">
        <span>분양가 <b id="sumBase">0원</b></span>
        <span class="op">+</span>
        <span>확장비 <b id="sumExpand">미선택</b></span>
        <span class="op">+</span>
        <span>옵션가 <b id="sumOpt">0원</b></span>
        <span class="op">=</span>
      </div>
      <div class="summary-total">
        총 <span id="sumTotalEok">0원</span>
        <span class="raw" id="sumTotalRaw">(0원)</span>
      </div>
    </div>
    <button type="button" class="btn-generate" id="generateBtn">📄 견적서 만들기</button>
  </div>
</div>

/* ============================================================
   HELPERS
   ============================================================ */
function fmtWon(n){ return n.toLocaleString('ko-KR') + '원'; }
function fmtEok(n){
  const eok = Math.floor(n / 100000000);
  const man = Math.round((n % 100000000) / 10000);
  let str = '';
  if(eok > 0) str += eok + '억 ';
  if(man > 0) str += man.toLocaleString('ko-KR') + '만';
  if(!str) str = '0';
  return str.trim() + '원';
}
function el(id){ return document.getElementById(id); }

});

function currentCategories(){
  return OPTION_CATEGORIES_BY_DANJI[state.danji] || OPTION_CATEGORIES_BY_DANJI['1단지'];
}

function renderOptTabs(){
  const wrap = el('catTabs');

    btn.type = 'button';
    btn.className = 'cat-tab' + (state.currentCat === cat.key ? ' active' : '');
    btn.textContent = cat.label;
    btn.addEventListener('click', ()=>{
      state.currentCat = cat.key;
      renderOptTabs();
      renderOptList();
    });

  });

// item.types: null(전체 타입 공통) | ['84A', ...](해당 타입에서만 표시)
// item.count: 대수(있으면 이름 뒤에 "(N대 · note)"로 표기, note가 '기본'이면 생략)
// item.count가 없을 때 item.note는 짧은 스펙 설명으로 보고, 목록엔 요약만 · 견적서엔 전체 표시
function resolveItem(item){
  if(item.types && item.types.indexOf(state.type) === -1) return null;
  let name = item.name;
  let desc = null;
  if(item.count){
    const suffix = item.note && item.note !== '기본' ? ' · ' + item.note : '';
    name = name + ' (' + item.count + '대' + suffix + ')';
  } else if(item.note){
    desc = item.note;
  }
  return { name, price: item.price, desc };
}

function renderOptList(){
  const wrap = el('optList');
  wrap.innerHTML = '';
  const cat = currentCategories().find(c=> c.key === state.currentCat);
  if(!cat) return;
  cat.items.forEach(item=>{
    const resolved = resolveItem(item);
    if(!resolved) return;
    const key = cat.key + '::' + item.id;
    const active = state.selectedOptions.has(key);
    const row = document.createElement('div');
    row.className = 'unit-row' + (active ? ' active' : '') + (resolved.desc ? ' has-desc' : '');
    row.innerHTML = `
      <span class="u-check">✓</span>
      <div class="u-body">
        <div class="u-top">
          <span class="u-main">${resolved.name}</span>
          <span class="u-price">+${fmtWon(resolved.price)}</span>
        </div>
        ${resolved.desc ? `<div class="u-desc">${resolved.desc.replace(/\n/g,' ')}</div>` : ''}
      </div>
    `;
    row.addEventListener('click', ()=> toggleOption(cat, item, resolved));
    wrap.appendChild(row);
  });
}

function toggleOption(cat, item, resolved){
  const key = cat.key + '::' + item.id;
  if(state.selectedOptions.has(key)){
    state.selectedOptions.delete(key);
  } else {
    state.selectedOptions.set(key, { id:item.id, name:resolved.name, price:resolved.price, desc:resolved.desc, catLabel:cat.label });
  }
  renderOptList();
  renderChips();
  updateSummary();
}

function renderChips(){
  const wrap = el('chipList');
  wrap.innerHTML = '';
  if(state.selectedOptions.size === 0){
    wrap.innerHTML = '<span class="chip-empty">선택된 옵션이 없습니다</span>';
    return;
  }
  state.selectedOptions.forEach((opt, key)=>{
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `${opt.name} <span class="chip-price">+${fmtWon(opt.price)}</span>`;
    const x = document.createElement('span');
    x.className = 'chip-x';
    x.textContent = '✕';
    x.addEventListener('click', ()=>{
      state.selectedOptions.delete(key);
      renderOptList();
      renderChips();
      updateSummary();
    });
    chip.appendChild(x);
    wrap.appendChild(chip);
  });
}

/* ============================================================
   합계 계산
   ============================================================ */
function updateSummary(){
  const basePrice = state.band ? state.band.price : 0;
  const expansionPrice = state.expansion ? state.expansion.price : 0;
  let optTotal = 0;
  state.selectedOptions.forEach(o=> optTotal += o.price);
  const total = basePrice + expansionPrice + optTotal;

  el('optValue').textContent = state.selectedOptions.size + '개 선택 · ' + fmtWon(optTotal);

  const bar = el('summaryBar');
  if(basePrice > 0){
    bar.style.display = 'block';
    el('sumBase').textContent = fmtWon(basePrice);
    el('sumExpand').textContent = state.expansion ? fmtWon(expansionPrice) : '미선택';
    el('sumOpt').textContent = fmtWon(optTotal);
    el('sumTotalEok').textContent = fmtEok(total);
    el('sumTotalRaw').textContent = '(' + fmtWon(total) + ')';
  } else {
    bar.style.display = 'none';
  }
}

}
